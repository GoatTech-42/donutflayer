<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5563d1"/>
      <stop offset="1" stop-color="#404ebf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- pickaxe: bold geometric T with pointed tips -->
  <g fill="#ffffff" stroke="#ffffff" stroke-linejoin="round">
    <!-- handle -->
    <rect x="236" y="110" width="40" height="290" rx="14"/>
    <!-- crossbar -->
    <rect x="108" y="128" width="296" height="46" rx="16"/>
    <!-- left tip -->
    <path d="M108 140 L74 152 L108 164 Z"/>
    <!-- right tip -->
    <path d="M404 140 L438 152 L404 164 Z"/>
  </g>
  <!-- grip notches -->
  <g fill="#404ebf" opacity="0.35">
    <rect x="236" y="330" width="40" height="7" rx="3.5"/>
    <rect x="236" y="352" width="40" height="7" rx="3.5"/>
  </g>
</svg>
